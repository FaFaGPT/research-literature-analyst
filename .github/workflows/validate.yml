name: Validate skill and examples

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install lightweight validation dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate package and local links
        run: |
          python scripts/validate_templates.py
          python scripts/validate_links.py
      - name: Test validators
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate illustrative vaults
        run: |
          for vault in examples/*/vault; do
            if [ -d "$vault" ]; then python scripts/validate_vault.py "$vault"; fi
          done
